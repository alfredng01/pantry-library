services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - pantry-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/items"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  client:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pantry-data:
